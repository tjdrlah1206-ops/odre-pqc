<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1115">
  <title>Continue Registration | ODRE PQC</title>
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1115;color:#edf6f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.box{width:min(520px,calc(100% - 32px));border:1px solid #3c4a50;border-radius:8px;padding:34px;background:#141e23}.brand{font-weight:850;color:#7be3f7;font-size:13px;letter-spacing:.1em}h1{font-size:34px;line-height:1.1;margin:18px 0 10px}p{color:#9fb1ae;font-size:14px;margin:0 0 24px}a{display:inline-flex;background:#7be3f7;color:#0b1115;border-radius:6px;padding:11px 15px;text-decoration:none;font-weight:850}</style>
</head>
<body><main class="box"><div class="brand">ODRE PQC</div><h1>Continue license registration</h1><p>Register your PayPal payment or subscription number and license delivery email.</p><a id="continue" href="/payment/register/">Continue</a></main><script>const allowed=['subscription_id','payment_id','plan','units'],source=new URLSearchParams(location.search),target=new URLSearchParams;allowed.forEach(key=>{const value=source.get(key);if(value)target.set(key,value)});const url='/payment/register/'+(target.size?'?'+target.toString():'');document.getElementById('continue').href=url;location.replace(url);</script></body>
</html>
